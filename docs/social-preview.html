<!doctype html>
<!-- Source for social-preview.png and banner.png. Regenerate: Chrome headless --window-size=1280,640 --screenshot (add --force-device-scale-factor=2 for banner.png). -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:640px;overflow:hidden}
body{background:#0b0d14;color:#f5f7fa;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(620px 420px at 22% 46%,rgba(4,116,196,.22),transparent 70%),radial-gradient(700px 500px at 88% 70%,rgba(255,255,255,.06),transparent 70%)}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:24px 24px;mask-image:linear-gradient(90deg,#000 0%,transparent 70%)}
.left{position:absolute;left:80px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
.logo{width:96px;height:96px;margin-bottom:34px;filter:drop-shadow(0 10px 30px rgba(4,116,196,.35))}
h1{font-size:72px;font-weight:800;letter-spacing:-.035em;line-height:1}
h2{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:22px;color:#c9d1dc}
h2 b{color:#3b9be0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.chip{font-size:17px;font-weight:600;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#dfe5ec}
.by{position:absolute;left:80px;bottom:44px;font-size:17px;color:#8a94a3;display:flex;align-items:center;gap:10px}
.by strong{color:#f5f7fa;font-weight:700}
.shot{position:absolute;left:700px;top:96px;width:900px;border-radius:16px;border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 8px rgba(255,255,255,.03);transform:perspective(1600px) rotateY(-12deg) rotateX(4deg);transform-origin:left center;overflow:hidden}
.shot img{display:block;width:100%}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="left">
  <img class="logo" src="logo.svg">
  <h1>Outreach Wise</h1>
  <h2>Self-hosted cold email.<br><b>A Google Sheet in, your inboxes out.</b></h2>
  <div class="chips"><span class="chip">Gmail · Microsoft 365 · SMTP</span><span class="chip">A/B tests</span><span class="chip">Auto-stop on reply</span><span class="chip">AI personalization</span></div>
</div>
<div class="by">Open source · MIT · by <strong>Channel Wise</strong></div>
<div class="shot"><img src="screenshots/dashboard.png"></div>
</body></html>
